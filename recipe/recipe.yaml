schema_version: 1

context:
  version: "0.9.2"

package:
  name: skia-pathops
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/skia-pathops/skia_pathops-${{ version }}.tar.gz
  sha256: 4b6d8459f6f4a69282cb26fca0c2bb0b321cc58a9bf9cc6579a52a391edc0319
  patches:
    # the sdist's vendored skia must not shadow the headers of the skia we link against
    - dont-use-vendored-skia-headers.patch

build:
  number: 3
  script:
    # link against the libskia package instead of building the vendored skia;
    # setup.py then locates it with pkg-config
    - export BUILD_SKIA_FROM_SOURCE=0
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - pkg-config
  host:
    - pip
    - python
    - setuptools
    - setuptools-scm
    - cython >=0.27
    - libskia
  run:
    - python

tests:
  - python:
      imports:
        - pathops
      pip_check: true
  - script:
      - python test_pathops.py
    files:
      recipe:
        - test_pathops.py
    requirements:
      run:
        - python

about:
  summary: Python access to operations on paths using the Skia library
  license: BSD-3-Clause
  license_file:
    - LICENSE
  homepage: https://github.com/fonttools/skia-pathops

extra:
  recipe-maintainers:
    - pavelzw
    - naveen521kk
