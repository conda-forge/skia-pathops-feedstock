schema_version: 1

context:
  name: skia-pathops
  version: "0.9.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 4b6d8459f6f4a69282cb26fca0c2bb0b321cc58a9bf9cc6579a52a391edc0319
  patches:
    # use ninja from conda instead
    - disable-virtualenv-creation.patch
    # use gn from conda
    - use-gn-from-conda.patch
    # use cc, cxx set by the environment
    - inherit-cc-cxx-from-environment.patch
    # fix for arm build on linux and mac
    - if: build_platform != target_platform
      then: add-correct-target-cpu.patch
    - if: win
      then: use-python-executable.patch
    - if: osx
      then: fix-min-expression.patch

build:
  number: 2
  skip: match(python, "<3.7")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - ninja
    - gn
  host:
    - pip
    - python
    - setuptools-scm
    - cython >=0.27
  run:
    - python

tests:
  - python:
      imports:
        - pathops
      pip_check: true

about:
  summary: Python access to operations on paths using the Skia library
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - src/cpp/skia-builder/skia/LICENSE
  homepage: https://github.com/fonttools/skia-pathops

extra:
  recipe-maintainers:
    - pavelzw
    - naveen521kk
