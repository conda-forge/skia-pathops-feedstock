schema_version: 1

context:
  version: "0.9.2"

package:
  name: skia-pathops
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/skia-pathops/skia_pathops-${{ version }}.tar.gz
  sha256: 4b6d8459f6f4a69282cb26fca0c2bb0b321cc58a9bf9cc6579a52a391edc0319
  patches:
    # the sdist's vendored skia must not shadow the headers of the skia we link against
    - dont-use-vendored-skia-headers.patch

build:
  number: 3
  # one build per platform instead of one per Python: every variant other than
  # python_min would produce the same abi3 extension
  skip: not (match(python, python_min ~ ".*") and is_abi3)
  script:
    # link against the libskia package instead of building the vendored skia;
    # setup.py then locates it with pkg-config. Set through env rather than a
    # shell command because `export` is not valid on Windows.
    env:
      BUILD_SKIA_FROM_SOURCE: "0"
      # already the upstream default, but stated so a change of that default
      # cannot silently turn this back into a per-Python build
      USE_PY_LIMITED_API: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv
  python:
    # setup.py compiles against the limited API (Py_LIMITED_API 0x030A0000) and
    # emits _pathops.abi3.so, so one build serves every supported Python
    version_independent: true

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - pkg-config
  host:
    - pip
    - python
    - python-abi3
    - setuptools
    - setuptools-scm
    - cython >=0.27
    - libskia
  run:
    - python

tests:
  - python:
      imports:
        - pathops
      pip_check: true
      # the point of the abi3 build is that one artifact works everywhere, so
      # import it both on the version it was compiled against and on the newest
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # runs against the newest python, which is the interesting direction: the
      # extension was compiled against ${{ python_min }}
      - python test_pathops.py
      # check the extension really only uses the limited API. 3.10 rather than
      # python_min because that is the floor setup.py compiles against, which
      # makes this the stricter assertion of the two.
      - if: unix
        then: abi3audit $SP_DIR/pathops/_pathops.abi3.so -s -v --assume-minimum-abi3 3.10
        else: abi3audit %SP_DIR%/pathops/_pathops.pyd -s -v --assume-minimum-abi3 3.10
    files:
      recipe:
        - test_pathops.py
    requirements:
      run:
        - python
        - abi3audit

about:
  summary: Python access to operations on paths using the Skia library
  license: BSD-3-Clause
  license_file:
    - LICENSE
  homepage: https://github.com/fonttools/skia-pathops

extra:
  recipe-maintainers:
    - pavelzw
    - naveen521kk
